services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mosquitto_broker
    ports:
      - "8883:8883"
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
      - ./certs:/mosquitto/certs:ro
    restart: always

  devices:
    build: ./devices
    container_name: python_simulators
    depends_on:
      - mosquitto
    volumes:
      - ./certs:/app/certs:ro
    restart: always

  openhab:
    image: openhab/openhab:4.0.0
    container_name: openhab_app
    ports:
      - "8081:8080"
    volumes:
      - ./openhab/conf:/openhab/conf
      - ./openhab/userdata:/openhab/userdata
      - ./openhab/addons:/openhab/addons
    environment:
      OPENHAB_HTTP_PORT: "8080"
    depends_on:
      - mosquitto
    restart: always
